[package]
name = "weyriva"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
clap = { version = "4.5", features = ["derive"] }
flate2 = "1.1"
fs2 = "0.4"
nix = { version = "0.30", features = ["fs", "poll", "user"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
signal-hook = "0.3"
socket2 = "0.6"
tar = "0.4"
thiserror = "2.0"
toml = "0.9"
ureq = { version = "2.12", default-features = false, features = ["tls"] }
walkdir = "2.5"

[dev-dependencies]
tempfile = "3.23"

[lints]
workspace = true
