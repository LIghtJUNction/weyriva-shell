# Weyriva login surface. greetd remains the internal PAM and VT broker.
[terminal]
vt = 1

[default_session]
command = "/usr/bin/env HOME=/var/lib/weyriva-greeter XDG_STATE_HOME=/var/lib/weyriva-greeter/state XDG_CACHE_HOME=/var/lib/weyriva-greeter/cache XDG_CONFIG_HOME=/var/lib/weyriva-greeter/config /usr/bin/cage -s -- /usr/bin/quickshell --path /usr/share/weyriva/greeter"
user = "greeter"
